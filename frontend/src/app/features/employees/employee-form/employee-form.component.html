<div class="module-page">

  <header class="page-header">
    <div class="page-header__intro">
      <span class="eyebrow">Ressources humaines</span>
      <h1>{{ isEdit ? 'Modifier l\'employé' : 'Nouvel employé' }}</h1>
      <p>{{ isEdit ? 'Mettez à jour la fiche puis enregistrez.' : 'Renseignez la fiche du nouvel employé.' }}</p>
    </div>
    <a routerLink="/admin/employees" class="btn-ghost">← Retour</a>
  </header>

  <div class="state-banner" *ngIf="loading">Chargement…</div>
  <div class="state-banner state-banner--error" *ngIf="error">{{ error }}</div>

  <section class="surface" *ngIf="!loading">
    <form (ngSubmit)="submitForm()" class="emp-form">

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Prénom *</label>
          <input type="text" id="firstName" [(ngModel)]="employee.firstName" name="firstName" required placeholder="ex. Ahmed" />
        </div>
        <div class="form-group">
          <label for="lastName">Nom *</label>
          <input type="text" id="lastName" [(ngModel)]="employee.lastName" name="lastName" required placeholder="ex. Ben Salah" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" [(ngModel)]="employee.email" name="email" required placeholder="prenom.nom@piqbit.tn" />
        </div>
        <div class="form-group">
          <label for="phone">Téléphone</label>
          <input type="tel" id="phone" [(ngModel)]="employee.phone" name="phone" placeholder="+216 …" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="position">Poste</label>
          <input type="text" id="position" [(ngModel)]="employee.position" name="position" placeholder="ex. Frontend Developer" />
        </div>
        <div class="form-group">
          <label for="department">Département</label>
          <select id="department" [(ngModel)]="employee.department" name="department">
            <option [ngValue]="undefined">— Choisir —</option>
            <option *ngFor="let d of departments" [value]="d">{{ d }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="salary">Salaire mensuel (TND)</label>
          <input type="number" id="salary" [(ngModel)]="employee.salary" name="salary" min="0" placeholder="ex. 2400" />
        </div>
        <div class="form-group">
          <label for="hireDate">Date d'embauche</label>
          <input type="date" id="hireDate" [(ngModel)]="employee.hireDate" name="hireDate" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="status">Statut</label>
          <select id="status" [(ngModel)]="employee.status" name="status">
            <option value="active">Actif</option>
            <option value="on-leave">En congé</option>
            <option value="inactive">Inactif</option>
          </select>
        </div>
        <div class="form-group"></div>
      </div>

      <div class="form-actions">
        <a routerLink="/admin/employees" class="btn-ghost">Annuler</a>
        <button type="submit" class="btn-primary" [disabled]="saving">
          {{ saving ? 'Enregistrement…' : (isEdit ? 'Enregistrer les modifications' : 'Créer l\'employé') }}
        </button>
      </div>
    </form>
  </section>
</div>
