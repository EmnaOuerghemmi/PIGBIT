<ng-container *ngIf="pending() as p">
  <!-- Le voile annule au clic, comme le reste des modales de l'application. -->
  <div class="cd__overlay" (click)="cancel()" aria-hidden="true"></div>

  <div class="cd" role="alertdialog" aria-modal="true"
       aria-labelledby="cd-title" aria-describedby="cd-msg">

    <div class="cd__icon" [class.is-danger]="p.danger" aria-hidden="true">
      <svg *ngIf="p.danger" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <svg *ngIf="!p.danger" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    </div>

    <h3 class="cd__title" id="cd-title">{{ p.title }}</h3>
    <p class="cd__msg" id="cd-msg">{{ p.message }}</p>

    <div class="cd__actions">
      <button type="button" class="cd__btn cd__btn--ghost" (click)="cancel()">
        {{ p.cancelLabel || 'Annuler' }}
      </button>
      <button type="button" class="cd__btn"
              [class.cd__btn--danger]="p.danger"
              [class.cd__btn--primary]="!p.danger"
              (click)="confirm()" autofocus>
        {{ p.confirmLabel || 'Confirmer' }}
      </button>
    </div>

  </div>
</ng-container>
