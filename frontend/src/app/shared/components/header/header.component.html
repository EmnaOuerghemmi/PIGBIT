<header class="app-header">
  <!-- Left: Burger + Logo -->
  <div class="header-left">
    <button class="burger-btn" (click)="toggleSidebar.emit()" [class.active]="sidebarCollapsed" title="Toggle sidebar">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <a routerLink="/dashboard" class="logo-link">
      <img src="assets/images/logo (3).png" alt="PIQBIT" class="header-logo" />
      <span class="logo-text">PIQBIT</span>
    </a>
  </div>

  <!-- Center: Search -->
  <div class="header-search">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" placeholder="Rechercher..." />
  </div>

  <!-- Right: Actions + User -->
  <div class="header-right">

    <!-- Notifications -->
    <button class="icon-btn" title="Notifications">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="badge">3</span>
    </button>

    <!-- User avatar + logout -->
    <div class="user-menu">
      <div class="avatar">
        <span>PQ</span>
      </div>
      <div class="user-info">
        <span class="user-name">Admin</span>
        <span class="user-role">PIQBIT</span>
      </div>
      <button class="logout-btn" (click)="logout()" title="Se déconnecter">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </div>
</header>
