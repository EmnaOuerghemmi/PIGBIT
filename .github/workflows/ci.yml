# ============================================================================
# Intégration continue PIQBIT
# ----------------------------------------------------------------------------
# Deux tâches indépendantes, exécutées en parallèle : la suite backend
# (~19 min) ne doit pas retarder le retour du build frontend (~1 min).
# ============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Une nouvelle poussée sur une branche annule le build précédent encore en
# cours : inutile de payer 19 minutes pour valider un commit déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        # Même image qu'en développement : la recherche sémantique s'appuie
        # sur pgvector, une image PostgreSQL nue ferait passer les tests par
        # le repli Python et masquerait une régression du chemin vectoriel.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: piqbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # torch depuis l'index CPU : la roue par défaut embarque ~2,5 Go de
          # bibliothèques CUDA inutiles sur un runner sans GPU.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements.txt

      - name: Vérifier que les migrations décrivent bien les modèles
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/piqbit_test
          SECRET_KEY: ci-secret-not-used-in-production
        run: |
          alembic upgrade head
          # Un autogenerate sur une base à jour doit produire une migration
          # VIDE. S'il détecte un écart, c'est qu'un modèle a été modifié sans
          # migration correspondante — le schéma dériverait en production.
          alembic revision --autogenerate -m "ci drift check" --rev-id ci_drift
          if grep -qE "op\.(create_table|drop_table|add_column|drop_column|alter_column|create_foreign_key|drop_constraint|create_index|drop_index)" \
               alembic/versions/ci_drift_ci_drift_check.py; then
            echo "::error::Des modèles ont changé sans migration Alembic associée."
            cat alembic/versions/ci_drift_ci_drift_check.py
            exit 1
          fi
          rm alembic/versions/ci_drift_ci_drift_check.py

      - name: Tests
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-not-used-in-production
          REDIS_URL: redis://localhost:6379
        run: pytest -q --no-header

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Build de production
        working-directory: frontend
        # Le build échoue sur toute erreur de typage : c'est le filet de
        # sécurité principal du frontend tant que la couverture de tests
        # unitaires reste faible.
        run: npm run build -- --configuration production

      - name: Tests unitaires
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
